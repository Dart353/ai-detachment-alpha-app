# Releases, driven by conventional commit subjects.
#
#   fix: …            → patch        feat: …           → minor
#   feat!: … / a "BREAKING CHANGE:" footer → major
#   chore: docs: refactor: test: build: ci: → no release on their own
#
# On every push to main, release-please reads the commits since the last tag
# and keeps ONE pull request open ("chore(main): release x.y.z") that bumps
# package.json and writes CHANGELOG.md, grouped into Features and Bug Fixes.
# Merging that PR is the release: release-please tags it and publishes the
# GitHub Release with the changelog as its notes, and the jobs below build the
# Windows and Linux packages and attach them.
#
# "Run workflow" with a tag rebuilds the installers for a release that already
# exists and attaches them — for when a build job failed after the tag was cut.
#
# macOS builds are signed and notarized with the Developer ID certificate in
# the CSC_LINK secret (team SL69NU235S, Alexander Suess). Squirrel.Mac only
# installs an update whose signature matches the running app's Team ID, so
# auto-update on macOS depends on every release being signed with that same
# certificate. Without the secret the build falls back to an ad-hoc signature,
# which launches but cannot auto-update (see README → Installing on a Mac).
#
# Secrets the mac job reads: CSC_LINK (base64 of the Developer ID Application
# .p12), CSC_KEY_PASSWORD (its export password), APPLE_ID and
# APPLE_APP_SPECIFIC_PASSWORD (for notarytool).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build installers for (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: node

  build:
    name: Package ${{ matrix.platform }}
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
            # top level only: the unpacked tree underneath is full of .exe files
            artifacts: |
              release/win/version_*/*.exe
              release/win/version_*/*.blockmap
              release/win/version_*/latest.yml
          - platform: linux
            os: ubuntu-latest
            artifacts: |
              release/linux/version_*/*.AppImage
              release/linux/version_*/latest-linux.yml
          - platform: mac
            os: macos-latest
            artifacts: |
              release/mac/version_*/*.dmg
              release/mac/version_*/*.zip
              release/mac/version_*/*.blockmap
              release/mac/version_*/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # postinstall rebuilds node-pty against Electron; the Windows runner has
      # the Visual Studio build tools and Python that needs.
      - run: pnpm install --frozen-lockfile
      # A rebuild of an existing tag checks out code that already shipped; its
      # tests ran when it was released, and re-running them there proves nothing.
      - if: github.event_name == 'push'
        run: pnpm typecheck && pnpm test
      # --publish never: electron-builder must not try to upload on its own when
      # it sees GH_TOKEN; the attach job below owns that.
      # CSC_IDENTITY_AUTO_DISCOVERY=false: with no Apple certificate in the
      # keychain, electron-builder would otherwise spend the job looking for
      # one; it ad-hoc signs the macOS app instead.
      - if: matrix.platform != 'mac'
        run: pnpm package:${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The mac job gets its own step because CSC_LINK must not exist at all on
      # the other runners: electron-builder treats even an empty CSC_LINK as a
      # certificate to sign with, and the Windows job would try to use it.
      # electron-builder imports the .p12 into a throwaway keychain, signs with
      # it, and notarizes whenever APPLE_ID is set. Auto-discovery has to stay
      # ON when a certificate is supplied — with it off, electron-builder never
      # looks in that keychain — and off when there is none, so the afterSign
      # hook ad-hoc signs instead of shipping an unsigned app.
      - if: matrix.platform == 'mac'
        run: pnpm package:mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: SL69NU235S
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  attach:
    name: Attach installers
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # one file per line: the installer's name has spaces in it
          find artifacts -type f | tee files.txt
          xargs -d '\n' -a files.txt gh release upload "$TAG" --clobber
